name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Validate agent work graph
        run: npm run validate:work-graph

      - name: Validate data source inventory
        run: npm run validate:data-inventory

      - name: Validate ChatGPT release package
        run: npm run validate:chatgpt-release

      - name: Validate ChatGPT private-staging boundary
        run: npm run validate:chatgpt-staging

      - name: Validate ChatGPT pilot bootstrap boundary
        run: npm run validate:chatgpt-pilot-bootstrap

      - name: Validate ChatGPT protected real-data boundary
        run: npm run validate:chatgpt-real-data-pilot

      - name: Audit high-severity dependency risk
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Test ChatGPT pilot bootstrap boundary
        run: npm run test:chatgpt-pilot-bootstrap

      - name: Test ChatGPT protected real-data boundary
        run: npm run test:chatgpt-real-data-pilot

      - name: Smoke intelligence service
        run: npm run smoke:intelligence-service

      - name: Smoke intelligence persistence
        run: npm run smoke:intelligence:mongo

      - name: Smoke OAuth persistence
        run: npm run smoke:oauth:mongo
