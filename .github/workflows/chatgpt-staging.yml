name: ChatGPT private staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-private-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-private-staging
    runs-on: ubuntu-latest
    environment: chatgpt-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Validate governed staging source
        run: |
          npm run validate:work-graph
          npm run validate:data-inventory
          npm run validate:chatgpt-release
          npm run validate:chatgpt-staging
          npm run typecheck
          npm run test
          npm run build

      - name: Verify Cloudflare authority and secret names
        run: npm run preflight -w @tax-lien/cloudflare-staging

      - name: Deploy private staging
        run: npm run deploy -w @tax-lien/cloudflare-staging
