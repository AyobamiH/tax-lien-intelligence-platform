name: Recover ChatGPT private-pilot owner credentials

on:
  workflow_dispatch:
    inputs:
      credential_loss_confirmed:
        description: Confirm the current private-pilot plaintext credential is unavailable
        required: true
        type: boolean
        default: false
      owner_identity_recovery_confirmed:
        description: Confirm the sole private-pilot owner should adopt the replacement identity secrets
        required: true
        type: boolean
        default: false
      password_ceremony_confirmed:
        description: Confirm a password manager generated and retained the replacement 12-256 character password
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-private-staging
  cancel-in-progress: false

jobs:
  recover:
    name: recover-exact-pilot-owner-credentials
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.credential_loss_confirmed &&
      inputs.owner_identity_recovery_confirmed &&
      inputs.password_ceremony_confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chatgpt-pilot-bootstrap
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build database dependencies
        run: |
          npm run build -w @tax-lien/engine-contract
          npm run build -w @tax-lien/db

      - name: Validate credential-recovery boundary
        run: npm run validate:chatgpt-pilot-credential-recovery

      - name: Recover exact pilot owner credentials
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CHATGPT_PILOT_EMAIL: ${{ secrets.CHATGPT_PILOT_EMAIL }}
          CHATGPT_PILOT_PASSWORD_HASH: ${{ secrets.CHATGPT_PILOT_PASSWORD_HASH }}
          PILOT_CREDENTIAL_RECOVERY_RECEIPT_PATH: artifacts/chatgpt-staging-pilot-credential-recovery-receipt.json
          LIVE_SOURCE_REVISION: ${{ github.sha }}
          LIVE_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run recover:chatgpt-staging:pilot-credentials

      - name: Archive sanitized credential-recovery receipt
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-staging-pilot-credential-recovery-receipt-${{ github.sha }}
          path: artifacts/chatgpt-staging-pilot-credential-recovery-receipt.json
          if-no-files-found: error
          retention-days: 30
