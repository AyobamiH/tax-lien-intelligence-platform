services:
  mongo:
    image: mongo:7
    container_name: tax-lien-platform-mongo
    ports:
      - "27017:27017"
    volumes:
      - tax_lien_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tax_lien_mongo_data:
